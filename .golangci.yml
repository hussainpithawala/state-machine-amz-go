version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - unused
    - gocritic
    - bodyclose
    - goconst
    - gocyclo
    - misspell
    - prealloc
    - whitespace
  settings:
    gocyclo:
      min-complexity: 15
    gocritic:
      enabled-tags:
        - performance
        - style
        - diagnostic
      disabled-checks:
        - hugeParam
  exclusions:
    paths:
      - examples
      - '_test\.go$'
    rules:
      - linters:
          - goconst
          - errcheck
          - misspell
          - gocyclo
        path: 'examples/'
